# Runs test classes AND methods concurrently within the single Surefire-forked JVM.
#
# Why this is safe here: every test class uses JUnit 5's default per-method instance lifecycle (no
# @TestInstance(Lifecycle.PER_CLASS) anywhere in this project), so instance fields are never shared
# across test methods to begin with; there is no mutable `static` test state anywhere in the suite;
# every real local HTTP server test binds an OS-assigned ephemeral port (0), never a fixed one; every
# git/filesystem fixture uses JUnit's @TempDir, never a fixed shared path; and the only two tests that
# mutate genuinely global JVM state (Locale.setDefault, for a Turkish-locale regression) are marked
# with @ResourceLock(Resources.LOCALE) so the framework itself serializes them against everything else.
#
# Most of this suite's wall-clock time is real `git`/`claude`(fake)/HTTP-server subprocess and I/O
# wait, not CPU -- a dynamic factor above 1.0 lets more of that I/O-bound work overlap than a plain
# one-thread-per-core pool would.
junit.jupiter.execution.parallel.enabled = true
junit.jupiter.execution.parallel.mode.default = concurrent
junit.jupiter.execution.parallel.mode.classes.default = concurrent
junit.jupiter.execution.parallel.config.strategy = dynamic
junit.jupiter.execution.parallel.config.dynamic.factor = 2.0
